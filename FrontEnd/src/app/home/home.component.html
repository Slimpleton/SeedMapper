<!-- HACK Base County Plant tile map ref -->
@if(isBrowser){
<svg width="0" height="0" style="position:absolute; pointer-events:none;">
    <defs>
        <!-- individual counties -->
        @for(c of countiesPaths$ | async; track c.id){
        <path [attr.id]="'county-' + c.id" [attr.name]="c.name" [attr.d]="c.d" />
        }

        <!-- base county mesh -->
        <path id="county-mesh" class="mesh county-mesh"
            [attr.d]="mapService.countyMeshPath$(PLANT_TILE_MAP_WIDTH, PLANT_TILE_MAP_HEIGHT) | async" />

        <path id="state-mesh" class="state-mesh"
            [attr.d]="mapService.stateMeshPath$(PLANT_TILE_MAP_WIDTH, PLANT_TILE_MAP_HEIGHT) | async" />

        <!-- nation border -->
        <path id="nation-border"
            [attr.d]="mapService.nationBorderPath$(PLANT_TILE_MAP_WIDTH, PLANT_TILE_MAP_HEIGHT) | async" />

    </defs>
</svg>
}

<!-- TODO convert search / filter to popout sidebar? -->

<div class="plant-search-container">
    <plant-search class="plant-search" (filteredDataBatch)="updatePlantData($event)"
        (filterInProgress$)="clearData($event)" style="width:100%"></plant-search>
</div>


@defer(when plantData.length > 0){
<section class="container" id="container">
    <cdk-virtual-scroll-viewport gridScroll #gridScroll="gridScroll" [rowHeight]="rowHeight" [columns]="columns"
        [gutterSize]="gutterSize" [buffer]="3" class="gov-container-scrollport">
        <div class="plant-grid" [ngStyle]="gridScroll.gridStyles">
            <plant-tile *cdkVirtualFor="let plant of plantData; trackBy: trackByPlant; let i = index"
                class="plant-holder" [plant]="plant" [isPriority]="i < 15">
            </plant-tile>
        </div>
    </cdk-virtual-scroll-viewport>
</section>
}

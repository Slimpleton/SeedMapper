<section id="plant-search-container">
    <div class="col">
        <!-- TODO angular multiselect for this kinda filtering -->
        <span class="label">{{'FILTERS' | transloco}}</span>
        <div id="search-container" name="search-container" class="search-container col">
            <input type="text" name="searchbar" id="searchbar" #searchBar (input)="search(searchBar.value)"
                [placeholder]="'SEARCHBAR_PLACEHOLDER' | transloco" class="searchbar">
            <div class="search-container row">
                <select (change)="changeGrowthHabit(growthHabitSelector.value)" name="growthHabitSelector"
                    [attr.aria-label]="'GROWTH_HABIT' | transloco" class="selector" id="growthHabitSelector"
                    #growthHabitSelector>
                    @for (growthHabit of growthHabits; track growthHabit) {
                    <option [value]="growthHabit">{{'GROWTH_HABITS.' + growthHabit| uppercase | transloco}}</option>
                    }
                </select>
                <!-- TODO allow for multi select -->
                <select (change)="changeDuration(durationSelector.value)" name="durationSelector" id="durationSelector"
                    [attr.aria-label]="'DURATION' | transloco" class="selector" #durationSelector>
                    @for(duration of durations; track duration){
                    <option [value]="duration">{{'DURATIONS.' + duration| uppercase | transloco}}</option>
                    }
                </select>
            </div>
        </div>
    </div>
    <div class="col">
        <div name="sort-container" id="sort-container" class="sort-container col">
            <span class="label sort-label">{{'SORT' | transloco}}</span>
            <select name="sortSelector" id="sortSelector" #sortSelector class="selector"
                [attr.aria-label]="'SORT' | transloco" (change)="changeSortOption(sortSelector.value)">
                @for (option of sortOptions; track $index) {
                <option [value]="option">{{ 'SORT_OPTIONS.' + option | uppercase | transloco}}</option>
                }
            </select>
            <button class="sortOrderButton" id="sortOrderButton" (click)="toggleSortOptionDirection()"
                [attr.aria-label]="('SORT' | transloco) + ' ' + sortOptionDirection">
                {{sortOptionDirection}}
            </button>
        </div>
    </div>

    <!-- TODO autocomplete angular aria -->
    <!-- TODO swap the datalist to a state => county selection on mobile for ease of use or maybe something else idk -->
    <!-- datalist sucks with ux -->

    <div class="filter-title-container">
        <h1 class="filter-title" id="filter-search-title">{{'NATIVE_PLANTS_IN' | transloco}} </h1>
        <div ngCombobox filterMode="auto-select">
            <div class="autocomplete" #countyOrigin>
                <input #countyNameInput ngComboboxInput [(ngModel)]="geolocationCountyNewQuery"
                    [placeholder]="'COUNTY_PLACEHOLDER' | transloco" id="county-choice" class="input-counties"
                    aria-labelledby="filter-search-title" />
            </div>
            <ng-template ngComboboxPopupContainer>
                <ng-template [cdkConnectedOverlay]="{origin: countyOrigin,  usePopover: 'inline', matchWidth: true}"
                    [cdkConnectedOverlayOpen]="true">
                    <div class="popup">
                        @if(filteredCounties()?.length === 0)
                        {
                        <div class="no-results">{{'NO_COUNTRIES_FOUND' | transloco}}</div>
                        }

                        <div class="listbox" ngListbox>
                            @for(county of filteredCounties(); track county.countyFip){
                            <div class="option" ngOption [value]="county.countyFip"
                                [label]="county.countyName + ' - ' + county.stateAbbrev">
                                <span class="option-label"> {{county.countyName + ' - ' + county.stateAbbrev}}</span>
                            </div>
                            }
                        </div>
                    </div>

                </ng-template>
            </ng-template>
        </div>
    </div>
</section>
